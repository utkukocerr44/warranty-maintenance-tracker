<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Warranty Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('index') }}">Warranty Tracker</a>
        <nav>
            {% if g.user %}
                <span class="username">{{ g.user["username"] }}</span>
                <a href="{{ url_for('create_item') }}">Add Item</a>
                <a href="{{ url_for('logout') }}">Logout</a>
            {% else %}
                <a href="{{ url_for('login') }}">Login</a>
                <a class="button-link" href="{{ url_for('register') }}">Register</a>
            {% endif %}
        </nav>
    </header>

    <main class="page">
        {% for message in get_flashed_messages() %}
            <div class="flash">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
